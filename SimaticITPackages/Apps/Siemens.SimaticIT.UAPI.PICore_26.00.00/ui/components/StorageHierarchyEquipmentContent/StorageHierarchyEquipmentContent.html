<div class="content-area content-area-relative component-box" id="itemlist">
    <div>
        <sit-tabset>
            <sit-tab heading="{{vm.storageHierarchyEquipmentPropertiesTabTitle}}" active="true">
                <div style="padding-top: 50px;">
                    <sit-property-grid sit-id="equipmentPropertyGrid"
                                       sit-layout="Horizontal"
                                       sit-type="Fixed"
                                       sit-mode="list"
                                       sit-columns="1"
                                       sit-data="vm.equipmentPropertyGridData">
                    </sit-property-grid>
                </div>
            </sit-tab>
            <sit-tab heading="{{vm.storageHierarchyEquipmentMaterialsTabTitle}}" active="false">
                <div>
                    <div class="pi-insidecomponent-title" style="padding-top: 20px;">{{vm.storageHierarchyEquipmentMaterialsTableTitle}} </div>
                    <sit-pi-table sit-pi-table-id="materialList"
                                  sit-config="vm.equipmentMaterialTableConfig"
                                  sit-pi-toolbar-buttons="vm.equipmentMaterialToolbarButtons"
                                  on-command-clicked="vm.onActionClicked(command)"
                                  sit-pi-toolbar-visible="!vm.isEquipmentMaterialActionBarHide && vm.equipmentId"
                                  sit-pi-config="vm.equipmentMaterialDataConfig"
                                  sit-view-mode="grid">
                    </sit-pi-table>
                </div>
            </sit-tab>
            <sit-tab heading="{{vm.storageHierarchyEquipmentMtusTabTitle}}" active="false">
                <div>
                    <div class="pi-insidecomponent-title" style="padding-top: 20px;">{{vm.storageHierarchyEquipmentMtusTableTitle}} </div>
                    <sit-pi-table sit-pi-table-id="equipmentMtuList"
                                  sit-config="vm.equipmentMtuTableConfig"
                                  sit-pi-toolbar-buttons="vm.equipmentMtuToolbarButtons"
                                  on-command-clicked="vm.onActionClicked(command)"
                                  sit-pi-toolbar-visible="!vm.isEquipmentMtuActionBarHide && vm.equipmentId"
                                  sit-pi-config="vm.equipmentMtuDataConfig"
                                  sit-view-mode="grid">
                    </sit-pi-table>
                </div>
            </sit-tab>
            <sit-tab heading="{{vm.storageHierarchyEquipmentMaterialLotsTabTitle}}" active="false">
                <div>
                    <div class="pi-insidecomponent-title" style="padding-top: 20px;">{{vm.storageHierarchyEquipmentMaterialLotsTableTitle}} </div>
                    <sit-pi-table sit-pi-table-id="equipmentMaterialLotList"
                                  sit-config="vm.equipmentMaterialLotTableConfig"
                                  sit-pi-toolbar-buttons="vm.equipmentMaterialLotToolbarButtons"
                                  on-command-clicked="vm.onActionClicked(command)"
                                  sit-pi-toolbar-visible="!vm.isEquipmentMaterialLotActionBarHide && vm.equipmentId"
                                  sit-pi-config="vm.equipmentMaterialLotDataConfig"
                                  sit-view-mode="grid">
                    </sit-pi-table>
                </div>
            </sit-tab>
        </sit-tabset>
    </div>
</div>
