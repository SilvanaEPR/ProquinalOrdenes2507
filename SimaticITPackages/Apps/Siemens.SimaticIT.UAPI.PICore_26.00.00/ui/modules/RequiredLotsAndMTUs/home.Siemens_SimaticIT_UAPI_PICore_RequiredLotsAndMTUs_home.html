<sit-container sit-isswac="False">
	<div gridster="mashup.layOutOptions">
		<sit-component style="display:none"
				grid-max-columns="{{mashup.layOutOptions.columns}}" grid-margin="{{mashup.layOutOptions.margins[0]}}"
				sit-name="home_mashup_1" sit-componentname="mashup"
				sit-type="ui" sit-source="sit-mashup"
				sit-left="0" sit-top="0"
				sit-rows="2" sit-cols="2"
				sit-flavor="ui"></sit-component>
		<sit-component gridster-item ng-show="mashup.componentInstances[1].isVisible"
				row="mashup.componentInstances[1].layout.row" col="mashup.componentInstances[1].layout.col"
				size-x="mashup.componentInstances[1].layout.sizeX" size-y="mashup.componentInstances[1].layout.sizeY"
				grid-max-columns="{{mashup.layOutOptions.columns}}" grid-margin="{{mashup.layOutOptions.margins[0]}}"
				sit-name="home_requiredmatmaterialdetails_2" sit-componentname="requiredmatmaterialdetails"
				sit-type="ui" sit-source="requiredmatmaterialdetails"
				sit-left="0" sit-top="0"
				sit-rows="12" sit-cols="12"
				sit-flavor="ui"
				sit-contracts="mashup.componentInstances[1].contracts"></sit-component>
		<sit-wire sit-name="DisableCloseButton" 
			sit-inputcomponents="home_mashup_1" 
			sit-inputtypes="ui" 
			sit-inputevents="onLoad" 
			sit-outputcomponents="home_requiredmatmaterialdetails_2" 
			sit-outputtypes="ui"
			sit-outputapis="enableCloseButton" 
			sit-converters="mashup.DisableCloseButtonConverter"></sit-wire>
		<sit-wire sit-name="setMaterialRequirement" 
			sit-inputcomponents="home_mashup_1" 
			sit-inputtypes="ui" 
			sit-inputevents="onLoad" 
			sit-outputcomponents="home_requiredmatmaterialdetails_2" 
			sit-outputtypes="ui"
			sit-outputapis="setWorkOrderOperationMaterialRequirementId" 
			sit-converters="mashup.setMaterialRequirementConverter"></sit-wire>
	</div>
</sit-container>
