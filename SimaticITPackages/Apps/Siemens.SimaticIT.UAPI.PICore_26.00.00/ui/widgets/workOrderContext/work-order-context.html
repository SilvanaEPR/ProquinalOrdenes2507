<div class="pi-command-bar-side-panel" style="float: left;">
    <span sit-table-button
          ng-repeat="(key,value) in vm.toolbarButtons"
          sit-icon="{{value.icon}}"
          sit-label="{{value.label}}"
          ng-click="vm.commandClick(value.name)"
          ng-show="value.visibility"
          style="height: 34px; width: 34px;"
          class="fa fa-lg"></span>
</div>
<div class="pi-component-title" ng-show="vm.isComponentTitleVisible">{{vm.componentContextTitle}}</div>

<div style="padding-top: 7px;padding-left:8px">
    <sit-property-grid sit-id="workOrderContextPropertyGrid"
                       sit-layout="Horizontal"
                       sit-type="Fixed"
                       sit-mode="edit"
                       sit-columns="3"
                       sit-rows="2"
                       sit-data="vm.workOrderContextPropertyGridData">
    </sit-property-grid>
    <sit-property-grid sit-id="woPropertyExt"
                       sit-layout="Horizontal"
                       sit-type="Fixed"
                       sit-mode="edit"
                       sit-columns="3" ng-show="!vm.NoData">
        <sit-property ng-repeat="prop in vm.woPropertyExtData"
                      sit-widget-attributes=prop.widgetAttributes
                      sit-widget={{prop.widget}}
                      sit-value=prop.value
                      sit-validation=prop.validation
                      ng-readonly=prop.read_only>
            {{prop.label}}:
        </sit-property>
    </sit-property-grid>
</div>
