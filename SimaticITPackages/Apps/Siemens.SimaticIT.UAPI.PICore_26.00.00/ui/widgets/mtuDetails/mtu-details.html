
<div class="pi-component-title" ng-show="vm.isComponentTitleVisible">{{vm.componentDetailsTitle}}</div>

<sit-tabset>
    <sit-tab heading="{{vm.tabHeader.overview}}">
        <div class="pi-command-bar-side-panel" ng-show="vm.isEditEnabled && !vm.showEdit && !vm.NoData">
            <button title="{{vm.editCmdLabel}}" ng-click="vm.onEditClick()" class="btn btn-default active">{{vm.editCmdLabel}}</button>
        </div>
        <div style="padding-top: 50px;" ng-show="vm.showDetails">
            <sit-property-grid sit-id="mtuPropertyGrid"
                               sit-layout="Horizontal"
                               sit-type="Fixed"
                               sit-mode="edit"
                               sit-columns="1"
                               sit-data="vm.mtuPropertyGridData">
            </sit-property-grid>
            <sit-property-grid sit-id="mtuPropertyExt"
                               sit-layout="Horizontal"
                               sit-type="Fixed"
                               sit-mode="edit"
                               sit-columns="1" ng-show="!vm.NoData">
                <sit-property ng-repeat="prop in vm.mtuPropertyExtData"
                              sit-widget-attributes=prop.widgetAttributes
                              sit-widget={{prop.widget}}
                              sit-value=prop.value
                              sit-validation=prop.validation
                              ng-readonly=prop.read_only>
                    {{prop.label}}:
                </sit-property>
            </sit-property-grid>
        </div>
        <sit-pi-mtu-create id="creationPage" on-register-create-api="vm.onRegisterCreateApi(api)" ng-show="vm.isEditEnabled && vm.showEdit"></sit-pi-mtu-create>
    </sit-tab>
    <sit-tab heading="{{vm.tabHeader.userFields}}">
        <sit-pi-mtu-user-fields on-register-user-fields-api="vm.onRegisterUserFieldsApi(api)"></sit-pi-mtu-user-fields>
    </sit-tab>
</sit-tabset>
