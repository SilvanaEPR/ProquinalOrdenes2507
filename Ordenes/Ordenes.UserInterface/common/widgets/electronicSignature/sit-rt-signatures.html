<style>
    .sign-icon {
        width: 24px;
        height: 24px;
        left: -3px;
        top: 8px;
        position: relative;
    }
    .sign-status {
        width: 16px;
        height: 16px;
        left: 5px;
        top: -2px;
        position: relative;
    }
    .table-width {
